name: CI

on:
  push:
    branches: [2.3.x, 2.7.x, 3.0.x, 3.1.x, 3.2.x, 3.3.x, 3.4.x, 3.5.x, 4.0.x, 4.1.x]
  pull_request:
    branches: [2.3.x, 2.7.x, 3.0.x, 3.1.x, 3.2.x, 3.3.x, 3.4.x, 3.5.x, 4.0.x, 4.1.x]

permissions:
  contents: read

jobs:
  build:
    if: >-
      (github.event_name == 'pull_request' && github.base_ref != '4.1.x') ||
      (github.event_name == 'push' && github.ref != 'refs/heads/4.1.x')
    uses: easy-4-java/.github/.github/workflows/maven-starter-ci.yml@main
    secrets: inherit

  build-4-1:
    name: build / JDK build and verify
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == '4.1.x' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/4.1.x')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure Easy4J Maven repositories
        env:
          MAVEN_SETTINGS_XML: ${{ secrets.MAVEN_SETTINGS_XML }}
        shell: bash
        run: |
          install -d -m 700 "$HOME/.m2"
          umask 077
          printf '%s' "$MAVEN_SETTINGS_XML" > "$HOME/.m2/settings.xml"

      - name: Provide Redis binary for isolated integration tests
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-tools
          mkdir -p "$RUNNER_TEMP/redis-package"
          cd "$RUNNER_TEMP/redis-package"
          apt-get download redis-server
          dpkg-deb -x redis-server_*.deb extracted
          # Ubuntu packages redis-server as a symlink to the binary in redis-tools.
          test -x /usr/bin/redis-check-rdb
          ln -s /usr/bin/redis-check-rdb extracted/usr/bin/redis-check-rdb
          echo "$RUNNER_TEMP/redis-package/extracted/usr/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/redis-package/extracted/usr/bin/redis-server" --version

      - name: Build and verify
        shell: bash
        run: |
          if [[ ! -x ./mvnw ]]; then
            echo "The 4.1.x branch requires an executable Maven 4 wrapper (./mvnw)." >&2
            exit 1
          fi
          ./mvnw -B --no-transfer-progress clean verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
          retention-days: 14
